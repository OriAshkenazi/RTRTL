schema_version: "1.1"
name: video-remotion-caption-brand
expected_outcome: |
  HebrewCaption.tsx renders the words as inline spans, in the array's logical order,
  inside one caption element that carries dir="rtl" (and lang="he"). The words are not
  each a flex item: a flex row orders its items by the container's direction, not by
  bidi, so a per-word flex box or row-reverse places "Acme Cloud" and the number by
  layout rather than by the text (CSS Flexbox Level 1, flex-direction). The Latin brand
  sits in an LTR scope, Hebrew word spans do not each get dir="rtl", and the array is
  not reversed.

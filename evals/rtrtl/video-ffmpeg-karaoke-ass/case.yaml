schema_version: "1.1"
name: video-ffmpeg-karaoke-ass
expected_outcome: |
  subs.ass holds one Dialogue line with the six words in logical order and per-word
  \k (or \kf/\ko) tags. The style it uses sets Encoding to -1, so libass picks the base
  direction from the text and lays the line out whole; with any other Encoding, libass
  resolves each karaoke run as its own left-to-right paragraph and the words come out
  in reversed order (libass ass_shaper.c ass_resolve_base_direction; COMPATIBILITY.md
  "Burned-in captions"). The text is not reversed or run through python-bidi, and
  burn.sh uses ffmpeg's subtitles (or ass) filter.

schema_version: "1.1"
name: office-pdf-hebrew-search-key
expected_outcome: |
  search_key.py folds niqqud and final letters only in a comparison key and never
  changes the stored text. It removes combining marks (Unicode category Mn) and
  keeps maqaf U+05BE, paseq U+05C0, sof pasuq U+05C3 and nun hafukha U+05C6, which
  are punctuation (Pd/Po) inside the Hebrew block, not points.

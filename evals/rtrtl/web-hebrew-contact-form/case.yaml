schema_version: "1.1"
name: web-hebrew-contact-form
expected_outcome: |
  contact.html has lang="he" dir="rtl"; the name input and the message textarea
  carry dir="auto"; email and website inputs carry dir="ltr"; the phone input is
  not forced to RTL. The font setup does not ship the Hebrew subset alone: it also
  loads the Latin subset (or the answer explains that the Hebrew subset lacks the
  space, digits and ASCII punctuation). Direction comes from markup, not the CSS
  direction property.

name: Validate RTRTL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: node --check docs/assets/app.js
      - run: node --check skills/rtrtl/scripts/check_browser.cjs
      - run: node tests/test_locale.cjs
      - run: node tests/test_install_prompt.cjs
      - run: node tests/test_language_picker.cjs
      - run: node tests/test_worker.cjs
      - run: node --check src/worker.mjs
      - run: node --check docs/assets/i18n.js
      - run: node --check docs/assets/language-picker.js

name: Release RTRTL
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python scripts/build_agent_skills.py
      - run: cp docs/.well-known/agent-skills/rtrtl.tar.gz "rtrtl-${GITHUB_REF_NAME}.tar.gz"
      # Sigstore provenance for the installable skill and its archive; Skills IL checks the latest release for it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            skills/rtrtl/SKILL.md
            skills/rtrtl/SKILL_HE.md
            rtrtl-${{ github.ref_name }}.tar.gz
      - name: Publish the release with the attested archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "rtrtl-${GITHUB_REF_NAME}.tar.gz" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "rtrtl-${GITHUB_REF_NAME}.tar.gz" --title "RTRTL $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

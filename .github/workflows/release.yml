name: Release RTRTL
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
  # Skills IL counts a release as signed only when the Sigstore attestation comes from its own
  # reusable workflow (signer identity skills-il/release-workflow), so it creates the release.
  release:
    needs: validate
    uses: skills-il/release-workflow/.github/workflows/release.yml@v1
    permissions:
      id-token: write
      contents: write
      attestations: write
    with:
      subject_path: |
        skills/rtrtl/SKILL.md
        skills/rtrtl/SKILL_HE.md
        skills/rtrtl/scripts/**
  archive:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/build_agent_skills.py
      - run: cp docs/.well-known/agent-skills/rtrtl.tar.gz "rtrtl-${GITHUB_REF_NAME}.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rtrtl-${{ github.ref_name }}.tar.gz
      - name: Add the installable archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "rtrtl-${GITHUB_REF_NAME}.tar.gz" --clobber

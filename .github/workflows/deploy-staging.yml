name: Deploy RTRTL staging
on:
  push:
    branches: [cloudflare-workers-migration]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA already pushed to this repository
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rtrtl-staging
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: node --check docs/assets/app.js
      - run: node --check skills/rtrtl/scripts/check_browser.cjs
      - run: node tests/test_locale.cjs
      - run: node tests/test_install_prompt.cjs
      - run: node tests/test_language_picker.cjs
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: deploy --env staging
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify public staging deployment
        run: python scripts/check_site.py https://staging.rtrtl.org --staging

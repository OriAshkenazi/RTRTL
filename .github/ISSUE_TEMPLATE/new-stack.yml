name: Add target-language compatibility tests or RTL guidance
description: Share compatibility evidence for a target RTL language or guidance for a stack, font, renderer, or export path.
title: "[Stack]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: >-
        Name the target language, writing system/script, and orthographic variant. Hebrew results do not certify another language. Use a small synthetic sample; do not include private material.
  - type: input
    id: target-language-script
    attributes:
      label: Target language and script
      description: Specify the language, writing system/script, and orthographic variant being tested.
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Stack, font, or renderer
      description: Include actual font/version, application/library/version, operating system, and export path/version.
      placeholder: Application 1.2, library 3.4, font/version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducible synthetic case
      description: Provide a small synthetic sample in the target language with mixed LTR tokens, numbers, punctuation, and relevant script features, plus exact steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and limits
      description: Separate source/structure, visual, interaction, and search/copy findings. State what remains untested and all limits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed guidance
      description: Describe native direction controls, mixed-script handling, fonts, export behavior, and limitations.
    validations:
      required: true

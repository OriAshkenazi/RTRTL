name: Report an RTL behavior or guidance issue
description: Report a reproducible RTL rendering, structure, search, or copy problem.
title: "[RTL issue]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Name the target language, writing system/script, and orthographic variant. Hebrew results do not certify another language. Use a small synthetic sample; do not include private material.
  - type: input
    id: target-language-script
    attributes:
      label: Target language and script
      description: Specify the language, writing system/script, and orthographic variant being tested.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and versions
      description: Include actual font/version, application/library/version, operating system, and export path/version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducible synthetic case
      description: Provide a small synthetic sample in the target language with mixed LTR tokens, numbers, punctuation, and relevant script features, plus exact steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and limits
      description: Separate source/structure, visual, interaction, and search/copy results. State what remains untested and all limits.
    validations:
      required: true
